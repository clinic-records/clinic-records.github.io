<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Glassmorphic Glow Gradient -->
    <linearGradient id="glassBg" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.7" />
    </linearGradient>

    <!-- Neon Medical Cross Gradient -->
    <linearGradient id="crossNeon" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Pulse ECG Line Gradient -->
    <linearGradient id="pulseNeon" x1="12" y1="60" x2="108" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glassmorphic Rounded Squircle (App Icon Container) -->
  <rect x="8" y="8" width="104" height="104" rx="28" 
        fill="url(#glassBg)" 
        stroke="url(#glassBorder)" 
        stroke-width="1.8" />

  <!-- Inner Soft Accent Ring -->
  <rect x="12" y="12" width="96" height="96" rx="24" 
        stroke="rgba(255, 255, 255, 0.15)" 
        stroke-width="1" fill="none" />

  <!-- Medical Cross Main Body (Outer Contour with Folded Top-Right Corner) -->
  <path d="
    M 49 22
    C 46 22, 44 24, 44 27
    L 44 44
    L 27 44
    C 24 44, 22 46, 22 49
    L 22 71
    C 22 74, 24 76, 27 76
    L 44 76
    L 44 93
    C 44 96, 46 98, 49 98
    L 71 98
    C 74 98, 76 96, 76 93
    L 76 76
    L 93 76
    C 96 76, 98 74, 98 71
    L 98 49
    C 98 46, 96 44, 93 44
    L 76 44
    L 76 33
    L 65 22
    Z
  " 
  fill="rgba(2, 132, 199, 0.12)"
  stroke="url(#crossNeon)" 
  stroke-width="3.2" 
  stroke-linejoin="round"
  stroke-linecap="round"
  filter="url(#softGlow)" />

  <!-- Folded Page / Document Ear Detail at Top Right -->
  <path d="M 65 22 L 65 33 L 76 33 Z" 
        fill="url(#crossNeon)" 
        stroke="url(#crossNeon)" 
        stroke-width="1.6" 
        stroke-linejoin="round" />

  <!-- Inner Echo / Layer Contour -->
  <path d="
    M 50 28
    L 50 48
    C 50 49, 49 50, 48 50
    L 28 50
    L 28 70
    L 48 70
    C 49 70, 50 71, 50 72
    L 50 92
    L 70 92
    L 70 72
    C 70 71, 71 70, 72 70
    L 92 70
    L 92 50
    L 72 50
    C 71 50, 70 49, 70 48
    L 70 37
    L 63 28
    Z
  " 
  fill="none" 
  stroke="url(#crossNeon)" 
  stroke-width="1.6" 
  stroke-opacity="0.55" 
  stroke-linejoin="round" />

  <!-- Dynamic ECG / Pulse Heartbeat Wave through Center -->
  <path d="
    M 14 60
    L 42 60
    L 46 52
    L 50 70
    L 56 36
    L 62 82
    L 68 50
    L 72 65
    L 76 60
    L 106 60
  " 
  stroke="url(#pulseNeon)" 
  stroke-width="3.2" 
  stroke-linecap="round" 
  stroke-linejoin="round" 
  filter="url(#softGlow)" />
</svg>
