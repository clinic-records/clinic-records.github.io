name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (Native .exe & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies for production
        run: npm prune --omit=dev

      - name: Prepare Windows Portable Package
        shell: pwsh
        run: |
          $pkgDir = "ClinicRecords-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$pkgDir"
          New-Item -ItemType Directory -Force -Path "$pkgDir/runtime"
          New-Item -ItemType Directory -Force -Path "$pkgDir/data"
          New-Item -ItemType Directory -Force -Path "$pkgDir/backups"
          New-Item -ItemType Directory -Force -Path "$pkgDir/storage/patients"

          # Download official standalone Node.js binary (Zero prerequisites needed on user PC)
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.18.0/win-x64/node.exe" -OutFile "$pkgDir/runtime/node.exe"

          # Copy application files
          Copy-Item -Recurse -Force "dist" "$pkgDir/dist"
          Copy-Item -Recurse -Force "public" "$pkgDir/public"
          Copy-Item -Recurse -Force "node_modules" "$pkgDir/node_modules"
          Copy-Item -Force "package.json" "$pkgDir/"
          Copy-Item -Force "start.bat" "$pkgDir/"
          Copy-Item -Force "start.bat" "$pkgDir/start-debug.bat"
          Copy-Item -Force "INSTRUCTIONS.txt" "$pkgDir/"
          Copy-Item -Force "README.md" "$pkgDir/"

          # Compile native Windows GUI Launcher "Clinic Records.exe"
          $source = @'
          using System;
          using System.Diagnostics;
          using System.IO;

          class Program {
              static void Main() {
                  string appDir = AppDomain.CurrentDomain.BaseDirectory;
                  string nodePath = Path.Combine(appDir, "runtime", "node.exe");
                  string scriptPath = Path.Combine(appDir, "dist", "server.js");

                  if (!File.Exists(nodePath)) {
                      nodePath = "node";
                  }

                  ProcessStartInfo psi = new ProcessStartInfo();
                  psi.FileName = nodePath;
                  psi.Arguments = "\"" + scriptPath + "\"";
                  psi.WorkingDirectory = appDir;
                  psi.UseShellExecute = false;
                  psi.CreateNoWindow = true;
                  Process.Start(psi);
              }
          }
'@
          Add-Type -TypeDefinition $source -Language CSharp -OutputAssembly "$pkgDir/Clinic Records.exe" -OutputType WindowsApplication

          # Create empty keep files
          New-Item -ItemType File -Force -Path "$pkgDir/data/.gitkeep"
          New-Item -ItemType File -Force -Path "$pkgDir/backups/.gitkeep"
          New-Item -ItemType File -Force -Path "$pkgDir/storage/patients/.gitkeep"

          # Compress to zip
          Compress-Archive -Path "$pkgDir" -DestinationPath "ClinicRecords-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-windows
          path: ClinicRecords-Windows-x64.zip

  build-macos-arm64:
    name: Build macOS Apple Silicon (.app Bundle)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package macOS Apple Silicon .app
        run: |
          PKG_NAME="ClinicRecords-macOS-AppleSilicon"
          APP_DIR="$PKG_NAME/Clinic Records.app"
          CONTENTS="$APP_DIR/Contents"
          RESOURCES="$CONTENTS/Resources/app"
          MACOS_BIN="$CONTENTS/MacOS"

          mkdir -p "$MACOS_BIN" "$PKG_NAME/data" "$PKG_NAME/backups" "$PKG_NAME/storage/patients" "$RESOURCES/runtime/bin"
          
          # Download standalone Node.js binary for Apple Silicon
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-arm64.tar.gz | tar -xz
          cp node-v20.18.0-darwin-arm64/bin/node "$RESOURCES/runtime/bin/node"
          chmod +x "$RESOURCES/runtime/bin/node"
          rm -rf node-v20.18.0-darwin-arm64

          # Copy application files into app bundle
          cp -r dist "$RESOURCES/"
          cp -r public "$RESOURCES/"
          cp -r node_modules "$RESOURCES/"
          cp package.json "$RESOURCES/"

          # Create Info.plist
          cat << 'EOF' > "$CONTENTS/Info.plist"
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>Clinic Records</string>
    <key>CFBundleIdentifier</key>
    <string>io.github.clinicrecords.app</string>
    <key>CFBundleName</key>
    <string>Clinic Records</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>LSMinimumSystemVersion</key>
    <string>11.0</string>
</dict>
</plist>
EOF

          # Create launch executable (determines container folder or Application Support)
          cat << 'EOF' > "$MACOS_BIN/Clinic Records"
#!/bin/bash
APP_DIR="$(cd "$(dirname "$0")/../Resources/app" && pwd)"
CONTAINER_DIR="$(cd "$(dirname "$0")/../../.." && pwd)"

if [ "$CONTAINER_DIR" = "/Applications" ] || [ ! -w "$CONTAINER_DIR" ]; then
    DATA_ROOT="$HOME/Library/Application Support/ClinicRecords"
    mkdir -p "$DATA_ROOT"
    cd "$DATA_ROOT"
else
    cd "$CONTAINER_DIR"
fi

mkdir -p data backups storage/patients
exec "$APP_DIR/runtime/bin/node" "$APP_DIR/dist/server.js"
EOF
          chmod +x "$MACOS_BIN/Clinic Records"

          # Copy instructions and debug launcher
          cp INSTRUCTIONS.txt "$PKG_NAME/"
          cp start.command "$PKG_NAME/start-debug.command"
          chmod +x "$PKG_NAME/start-debug.command"

          zip -r "ClinicRecords-macOS-AppleSilicon.zip" "$PKG_NAME"

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-macos-arm64
          path: ClinicRecords-macOS-AppleSilicon.zip

  build-macos-intel:
    name: Build macOS Intel (.app Bundle)
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package macOS Intel .app
        run: |
          PKG_NAME="ClinicRecords-macOS-Intel"
          APP_DIR="$PKG_NAME/Clinic Records.app"
          CONTENTS="$APP_DIR/Contents"
          RESOURCES="$CONTENTS/Resources/app"
          MACOS_BIN="$CONTENTS/MacOS"

          mkdir -p "$MACOS_BIN" "$PKG_NAME/data" "$PKG_NAME/backups" "$PKG_NAME/storage/patients" "$RESOURCES/runtime/bin"
          
          # Download standalone Node.js binary for Intel macOS
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-x64.tar.gz | tar -xz
          cp node-v20.18.0-darwin-x64/bin/node "$RESOURCES/runtime/bin/node"
          chmod +x "$RESOURCES/runtime/bin/node"
          rm -rf node-v20.18.0-darwin-x64

          # Copy application files into app bundle
          cp -r dist "$RESOURCES/"
          cp -r public "$RESOURCES/"
          cp -r node_modules "$RESOURCES/"
          cp package.json "$RESOURCES/"

          # Create Info.plist
          cat << 'EOF' > "$CONTENTS/Info.plist"
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>Clinic Records</string>
    <key>CFBundleIdentifier</key>
    <string>io.github.clinicrecords.app</string>
    <key>CFBundleName</key>
    <string>Clinic Records</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>LSMinimumSystemVersion</key>
    <string>10.15</string>
</dict>
</plist>
EOF

          # Create launch executable
          cat << 'EOF' > "$MACOS_BIN/Clinic Records"
#!/bin/bash
APP_DIR="$(cd "$(dirname "$0")/../Resources/app" && pwd)"
CONTAINER_DIR="$(cd "$(dirname "$0")/../../.." && pwd)"

if [ "$CONTAINER_DIR" = "/Applications" ] || [ ! -w "$CONTAINER_DIR" ]; then
    DATA_ROOT="$HOME/Library/Application Support/ClinicRecords"
    mkdir -p "$DATA_ROOT"
    cd "$DATA_ROOT"
else
    cd "$CONTAINER_DIR"
fi

mkdir -p data backups storage/patients
exec "$APP_DIR/runtime/bin/node" "$APP_DIR/dist/server.js"
EOF
          chmod +x "$MACOS_BIN/Clinic Records"

          # Copy instructions and debug launcher
          cp INSTRUCTIONS.txt "$PKG_NAME/"
          cp start.command "$PKG_NAME/start-debug.command"
          chmod +x "$PKG_NAME/start-debug.command"

          zip -r "ClinicRecords-macOS-Intel.zip" "$PKG_NAME"

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-macos-intel
          path: ClinicRecords-macOS-Intel.zip

  build-linux:
    name: Build Linux x64 Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package Linux
        run: |
          PKG_DIR="ClinicRecords-Linux-x64"
          mkdir -p "$PKG_DIR/data" "$PKG_DIR/backups" "$PKG_DIR/storage/patients" "$PKG_DIR/runtime/bin"
          
          # Download standalone Node.js binary for Linux
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.gz | tar -xz
          cp node-v20.18.0-linux-x64/bin/node "$PKG_DIR/runtime/bin/node"
          chmod +x "$PKG_DIR/runtime/bin/node"
          rm -rf node-v20.18.0-linux-x64

          # Copy application files
          cp -r dist "$PKG_DIR/"
          cp -r public "$PKG_DIR/"
          cp -r node_modules "$PKG_DIR/"
          cp package.json start.sh INSTRUCTIONS.txt README.md "$PKG_DIR/"
          chmod +x "$PKG_DIR/start.sh"

          tar -czf "ClinicRecords-Linux-x64.tar.gz" "$PKG_DIR"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-linux
          path: ClinicRecords-Linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64, build-macos-intel, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Determine Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0.0"
            fi
            echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: Clinic Patient Records ${{ steps.tag.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🏥 نظام إدارة سجلات وتاريخ المرضى للعيادات الطبية
            ### Clinic Patient Records Management System

            نسخ محمولة بالكامل ولا تتطلب أي تثبيت مسبق (No prerequisites or Node.js required).

            ---

            ### 🚀 خطوات التشغيل وتخطي تنبيهات الأمان (Installation & Quick Start)

            #### 🪟 ويندوز (Windows 10 / 11):
            1. حمل ملف `ClinicRecords-Windows-x64.zip` وفك الضغط.
            2. اضغط نقرتين على **`Clinic Records.exe`**.
            3. **إذا ظهرت نافذة حماية ويندوز (Windows protected your PC):**
               - اضغط على **More info** (المزيد من المعلومات).
               - اضغط على **Run anyway** (تشغيل على أي حال).
            *(يتوفر أيضاً ملف `start-debug.bat` في حال أردت متابعة سجلات السيرفر)*.

            #### 🍏 ماك (macOS):
            1. حمل ملف النظام المناسب لجهازك وفك الضغط:
               - لأجهزة الماك الحديثة (M1/M2/M3/M4): `ClinicRecords-macOS-AppleSilicon.zip`
               - لأجهزة الماك القديمة (Intel): `ClinicRecords-macOS-Intel.zip`
            2. افتح تطبيق **`Clinic Records.app`**.
            3. **لتخطي تنبيه ماك عند أول تشغيل:**
               - اضغط بزر الفأرة الأيمن (**Right-Click**) على التطبيق واختر **Open** (فتح).
               - اضغط على زر **Open** في الرسالة التأكيدية.
               - *(أو شغّل الأمر: `xattr -cr "Clinic Records.app"` في Terminal)*.

            #### 🐧 لينكس (Linux):
            1. فك الضغط عن `ClinicRecords-Linux-x64.tar.gz`.
            2. شغّل الأمر: `./start.sh`.

            ---

            ### 📱 الربط مع هواتف العيادة (Mobile & Wi-Fi):
            - تأكد من اتصال الهاتف والكمبيوتر بنفس شبكة الواي فاي (Wi-Fi).
            - امسح رمز الـ **QR Code** الظاهر في واجهة البرنامج للوصول الفوري للسجلات وإضافة الزيارات من الهاتف.
          files: |
            release_assets/*.zip
            release_assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
