name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (Standalone Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies for production
        run: npm prune --omit=dev

      - name: Prepare Windows Portable Package
        shell: pwsh
        run: |
          $pkgDir = "ClinicRecords-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$pkgDir"
          New-Item -ItemType Directory -Force -Path "$pkgDir/runtime"
          New-Item -ItemType Directory -Force -Path "$pkgDir/data"
          New-Item -ItemType Directory -Force -Path "$pkgDir/backups"
          New-Item -ItemType Directory -Force -Path "$pkgDir/storage/patients"

          # Download official standalone Node.js binary (Zero prerequisites needed on user PC)
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.18.0/win-x64/node.exe" -OutFile "$pkgDir/runtime/node.exe"

          # Copy application files
          Copy-Item -Recurse -Force "dist" "$pkgDir/dist"
          Copy-Item -Recurse -Force "public" "$pkgDir/public"
          Copy-Item -Recurse -Force "node_modules" "$pkgDir/node_modules"
          Copy-Item -Force "package.json" "$pkgDir/"
          Copy-Item -Force "start.bat" "$pkgDir/"
          Copy-Item -Force "README.md" "$pkgDir/"

          # Create empty keep files
          New-Item -ItemType File -Force -Path "$pkgDir/data/.gitkeep"
          New-Item -ItemType File -Force -Path "$pkgDir/backups/.gitkeep"
          New-Item -ItemType File -Force -Path "$pkgDir/storage/patients/.gitkeep"

          # Compress to zip
          Compress-Archive -Path "$pkgDir" -DestinationPath "ClinicRecords-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-windows
          path: ClinicRecords-Windows-x64.zip

  build-macos-arm64:
    name: Build macOS Apple Silicon (Standalone Portable)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package macOS Apple Silicon
        run: |
          PKG_DIR="ClinicRecords-macOS-AppleSilicon"
          mkdir -p "$PKG_DIR/data" "$PKG_DIR/backups" "$PKG_DIR/storage/patients" "$PKG_DIR/runtime/bin"
          
          # Download standalone Node.js binary for Apple Silicon
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-arm64.tar.gz | tar -xz
          cp node-v20.18.0-darwin-arm64/bin/node "$PKG_DIR/runtime/bin/node"
          chmod +x "$PKG_DIR/runtime/bin/node"
          rm -rf node-v20.18.0-darwin-arm64

          # Copy application files
          cp -r dist "$PKG_DIR/"
          cp -r public "$PKG_DIR/"
          cp -r node_modules "$PKG_DIR/"
          cp package.json start.command README.md "$PKG_DIR/"
          chmod +x "$PKG_DIR/start.command"

          zip -r "ClinicRecords-macOS-AppleSilicon.zip" "$PKG_DIR"

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-macos-arm64
          path: ClinicRecords-macOS-AppleSilicon.zip

  build-macos-intel:
    name: Build macOS Intel (Standalone Portable)
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package macOS Intel
        run: |
          PKG_DIR="ClinicRecords-macOS-Intel"
          mkdir -p "$PKG_DIR/data" "$PKG_DIR/backups" "$PKG_DIR/storage/patients" "$PKG_DIR/runtime/bin"
          
          # Download standalone Node.js binary for Intel macOS
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-x64.tar.gz | tar -xz
          cp node-v20.18.0-darwin-x64/bin/node "$PKG_DIR/runtime/bin/node"
          chmod +x "$PKG_DIR/runtime/bin/node"
          rm -rf node-v20.18.0-darwin-x64

          # Copy application files
          cp -r dist "$PKG_DIR/"
          cp -r public "$PKG_DIR/"
          cp -r node_modules "$PKG_DIR/"
          cp package.json start.command README.md "$PKG_DIR/"
          chmod +x "$PKG_DIR/start.command"

          zip -r "ClinicRecords-macOS-Intel.zip" "$PKG_DIR"

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-macos-intel
          path: ClinicRecords-macOS-Intel.zip

  build-linux:
    name: Build Linux x64 (Standalone Portable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package Linux
        run: |
          PKG_DIR="ClinicRecords-Linux-x64"
          mkdir -p "$PKG_DIR/data" "$PKG_DIR/backups" "$PKG_DIR/storage/patients" "$PKG_DIR/runtime/bin"
          
          # Download standalone Node.js binary for Linux
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.gz | tar -xz
          cp node-v20.18.0-linux-x64/bin/node "$PKG_DIR/runtime/bin/node"
          chmod +x "$PKG_DIR/runtime/bin/node"
          rm -rf node-v20.18.0-linux-x64

          # Copy application files
          cp -r dist "$PKG_DIR/"
          cp -r public "$PKG_DIR/"
          cp -r node_modules "$PKG_DIR/"
          cp package.json start.sh README.md "$PKG_DIR/"
          chmod +x "$PKG_DIR/start.sh"

          tar -czf "ClinicRecords-Linux-x64.tar.gz" "$PKG_DIR"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-records-linux
          path: ClinicRecords-Linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64, build-macos-intel, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Determine Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: Clinic Patient Records ${{ steps.tag.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            clinic-records-windows/ClinicRecords-Windows-x64.zip
            clinic-records-macos-arm64/ClinicRecords-macOS-AppleSilicon.zip
            clinic-records-macos-intel/ClinicRecords-macOS-Intel.zip
            clinic-records-linux/ClinicRecords-Linux-x64.tar.gz
